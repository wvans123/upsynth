[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "upsynth"
version = "0.1.0"
description = "Identify 5G user-plane flows by application and synthesize realistic user-plane pcaps from de-identified profiles"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "dpkt>=1.9.8",
  "pyarrow>=15",
  "numpy>=1.26",
  "cryptography>=42",
]

[project.optional-dependencies]
ndpi = ["nfstream>=6.5"]
mcp = ["fastmcp>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
upsynth = "upsynth.cli:main"
upsynth-mcp = "upsynth.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["upsynth"]

[tool.hatch.build.targets.sdist]
include = ["upsynth", "skills", "tests", "examples", "README.md", "BRIEF.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
