# upsynth application knowledge base.
#
# domains: "example.com" matches the name and every subdomain; the longest matching suffix wins
#          across all apps, so mail.google.com goes to gmail before google. "*" globs, "re:" regex.
# asns:    only networks the app uses alone (a cloud or CDN ASN is never listed under an app).
# ports:   "udp/3478" or "tcp/8801-8810"; used when a flow has no name. alpn narrows a port match.
# Sources: MIRAGE-2019 / MIRAGE-AppAct-2024 app lists, vendor network requirement pages, nDPI host
# lists. Changes are reviewed by a person before merge.
